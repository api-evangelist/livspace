name: Livspace
description: >-
  Livspace is India's largest home interior design and renovation company, founded in 2014 and
  headquartered in Bangalore. It runs an end-to-end, technology-driven interiors platform: free
  design consultation, in-browser 3D visualisation, factory-made modular products (kitchens,
  wardrobes, storage), and managed on-site installation, backed by a lifetime warranty on modular
  products. Livspace serves 125+ cities across India through 100+ Experience Centres and a network
  of interior designers, covering full-home interiors, modular kitchens, false ceilings, flooring,
  painting and related fit-out services. It is a Bessemer Venture Partners portfolio company. This
  profile currently exposes no public developer API or SDK surface; enrichment captured its public
  security, well-known, and llms.txt surfaces.
